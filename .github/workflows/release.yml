name: Build and Release Server

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag version for this release (e.g. v1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -B build -A x64

      - name: Compile Release Binary
        run: |
          cmake --build build --config Release

      - name: Prepare Release Package
        shell: pwsh
        run: |
          $dist = "tibia-772-server-windows-x64"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          # Copy compiled binary
          Copy-Item "build/Release/tibia-server.exe" -Destination "$dist/tibia-server.exe" -Force

          # Copy runtime DLLs
          $dlls = @("mpir.dll", "libmariadb.dll", "z.dll")
          foreach ($dll in $dlls) {
            if (Test-Path $dll) {
              Copy-Item $dll -Destination "$dist/$dll" -Force
            }
          }

          # Copy default configurations, keys and database schemas
          $assets = @(
            "config.cfg",
            "tibia.pem",
            "tibia.db",
            "schema.sql",
            "schema_mysql.sql",
            "schema_pgsql.sql",
            "README.md",
            "LICENSE.txt"
          )
          foreach ($item in $assets) {
            if (Test-Path $item) {
              Copy-Item $item -Destination "$dist/$item" -Force
            }
          }

          # Create compressed ZIP archive
          Compress-Archive -Path "$dist/*" -DestinationPath "tibia-772-server-windows-x64.zip" -Force
          Write-Host "Package created: tibia-772-server-windows-x64.zip"

      - name: Upload Build Artifact (Always Available in Actions)
        uses: actions/upload-artifact@v4
        with:
          name: tibia-772-server-windows-x64
          path: tibia-772-server-windows-x64.zip

      - name: Publish GitHub Release (on Tags or Manual Tag input)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.release_tag }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.release_tag }}
          files: tibia-772-server-windows-x64.zip
          generate_release_notes: true
