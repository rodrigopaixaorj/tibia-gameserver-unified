# CipSoft/Tibia 7.72 Server Configuration
# ==============================================================================

# Network Configuration
login_port = 7171
game_port = 7172
bind_address = "0.0.0.0"
world_address = "127.0.0.1"
world_name = "Zanera"

# Capacity & Connection Limits
max_players = 1000
max_connections = 1100
connection_timeout = 30

# Game Data Paths
data_path = "../CipSoft Server/tibia-game_data/dat"
map_path = "../CipSoft Server/tibia-game_data/map"
save_path = "../CipSoft Server/tibia-game_data/save"
log_path = "../CipSoft Server/tibia-game_data/log"

# ==============================================================================
# Database Configuration
# ==============================================================================
# Driver type: "sqlite" or "mysql"
db_type = "sqlite"

# --- SQLite Configuration (when db_type = "sqlite") ---
database_file = "tibia.db"

# --- MySQL / MariaDB Configuration (when db_type = "mysql") ---
mysql_host = "127.0.0.1"
mysql_port = 3306
mysql_user = "root"
mysql_password = ""
mysql_database = "tibia"
mysql_reconnect = true

# RSA Private Key
rsa_key_file = "tibia.pem"

# Message of the Day (MOTD)
motd = "Welcome to Tibia!"

# ==============================================================================
# Server Multipliers & Rates
# ==============================================================================
rate_exp = 1
rate_skill = 1
rate_magic = 1
rate_loot = 1
rate_spawn = 1
rate_hp_regen = 1
rate_mana_regen = 1

# ==============================================================================
# Gameplay & Item Consumption
# ==============================================================================
# When set to true, players must learn/buy spells from NPCs before casting them.
# When set to false, spells are automatically available once level, magic level, and vocation requirements are met.
learn_spells = false

# When set to false, runes will not lose charges or be deleted upon use
remove_charges_from_runes = false

# When set to false, vials/potions (mana/life fluids) will not be emptied upon use
remove_charges_from_vials = false

# When set to false, ammunition and thrown weapons will not be consumed/dropped
remove_weapon_ammunition = false

# When set to false, weapons and shields with limited uses/charges will not wear out
remove_weapon_charges = false

# When set to true, players have infinite carry capacity / ignore item weight
free_capacity = false

# When set to true, the game world is fully illuminated (always full light)
always_light = false

# Maximum summons per player (convince creature / summon)
max_summons_per_player = 2

# ==============================================================================
# Combat & Timers
# ==============================================================================
# Attack interval in milliseconds (default: 2000 = 2 seconds)
attack_interval = 2000

# Defense/shield interval in milliseconds (default: 2000 = 2 seconds)
defense_interval = 2000

# Global spell exhaustion/cooldown in milliseconds (default: 1000 = 1 second)
spell_exhaustion = 1000

# Rune exhaustion/cooldown in milliseconds (default: 2000 = 2 seconds)
rune_exhaustion = 2000

# Delay when jumping stairs/changing floors before acting (default: 2000 ms)
stair_jump_exhaustion = 2000

# ==============================================================================
# PvP & Skulls
# ==============================================================================
# World type: "pvp" (normal), "no-pvp" (non-pvp), "pvp-enforced"
world_type = "pvp"

# Minimum level to participate in PvP combat
protection_level = 1

# Unjustified kills to acquire Red Skull (day, week, month)
kills_to_red_skull = 3
kills_to_red_skull_week = 5
kills_to_red_skull_month = 10

# Unjustified kills to trigger banishment / excessive killing
kills_to_ban = 6
kills_to_ban_week = 10
kills_to_ban_month = 20

# Duration in seconds for White Skull (default: 900 = 15 minutes)
white_skull_time = 900

# Duration in seconds for in-fight / logout lock (default: 60 = 1 minute)
in_fight_time = 60

# Duration in seconds for Red Skull (default: 2592000 = 30 days)
red_skull_duration = 2592000

# ==============================================================================
# Death & Losses
# ==============================================================================
# Base percentage of experience/skills lost on death (default: 10%)
death_lose_percent = 10

# Whether players gain experience by killing other players
experience_by_killing_players = false

# Percentage of victim experience awarded to killer in PvP-Enforced mode (default: 5%)
pvp_enforced_exp_percent = 5

# ==============================================================================
# Soul Points
# ==============================================================================
# Whether spells and runes require and consume Soul Points
enable_soul_points = true

# Interval in seconds to regenerate 1 Soul Point (regular / promoted)
soul_regen_interval = 120
soul_regen_interval_promoted = 15

# ==============================================================================
# Houses
# ==============================================================================
# Minimum character level required to buy a house
house_buy_level = 1

# Restrict house ownership to premium accounts only
house_only_premium = true


